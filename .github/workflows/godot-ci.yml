name: "godot-ci export"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version (e.g. v1.0.0)"
        required: true
        default: "v0.0.0"

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: "SUIT-VR-Climb"
  PROJECT_PATH: .
  VERSION: ${{ github.event.inputs.version }}
  # Addon binaries are not committed; they are downloaded from these releases.
  OPENXR_VENDORS_VERSION: 5.1.0-stable
  META_TOOLKIT_VERSION: 1.0.3-stable

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-24.04
    steps:
      - name: Check version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${{ github.event.inputs.version }}'. Expected format: vX.Y.Z (e.g. v1.0.0)"
            exit 1
          fi

  import-assets:
    name: Import Assets
    runs-on: ubuntu-24.04
    needs: validate-version
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Import Assets
        run: |
          cd $PROJECT_PATH
          godot --headless --verbose --import
      - name: Cache Imported Assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: ${{ runner.os }}-godot-imported-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', '**/*.otf', '**/*.ttf', '**/*.png', '**/*.mp3') }}

  export-windows:
    name: Windows Export
    runs-on: ubuntu-24.04
    needs: import-assets
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Restore Imported Assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: ${{ runner.os }}-godot-imported-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', '**/*.otf', '**/*.ttf', '**/*.png', '**/*.mp3') }}
      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --import
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/windows/${EXPORT_NAME}.exe"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  export-linux:
    name: Linux Export
    runs-on: ubuntu-24.04
    needs: import-assets
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Restore Imported Assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: ${{ runner.os }}-godot-imported-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', '**/*.otf', '**/*.ttf', '**/*.png', '**/*.mp3') }}
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --import
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/linux/${EXPORT_NAME}.x86_64"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux

  export-android:
    name: Android (Quest) Export
    runs-on: ubuntu-24.04
    needs: import-assets
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          # Editor settings (Android SDK/JDK paths, debug keystore) live under /root, but GitHub sets HOME=/github/home.
          mv /root/.config/godot ~/.config/godot
      - name: Install Android SDK Packages
        # Godot 4.7's Gradle template needs newer SDK packages than the image ships.
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;29.0.14206865"
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Restore Imported Assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: ${{ runner.os }}-godot-imported-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd', '**/*.otf', '**/*.ttf', '**/*.png', '**/*.mp3') }}
      - name: Android Build
        # Debug export, signed with the image's debug keystore (sideload only).
        run: |
          mkdir -v -p build/android
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --import
          godot --headless --verbose --install-android-build-template --export-debug "Android" "$EXPORT_DIR/android/${EXPORT_NAME}_${VERSION}_quest-debug.apk"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/android

  release:
    name: Create Draft Release
    runs-on: ubuntu-24.04
    needs: [export-windows, export-linux, export-android]
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: build/windows
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android
          path: build/android
      - name: Zip Windows Build
        run: |
          cd build/windows
          zip -r "../${EXPORT_NAME}_${VERSION}_windows.zip" .
      - name: Zip Linux Build
        run: |
          cd build/linux
          zip -r "../${EXPORT_NAME}_${VERSION}_linux.zip" .
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.version }}
          name: "${{ env.EXPORT_NAME }} ${{ github.event.inputs.version }}"
          files: |
            build/${{ env.EXPORT_NAME }}_${{ env.VERSION }}_windows.zip
            build/${{ env.EXPORT_NAME }}_${{ env.VERSION }}_linux.zip
            build/android/${{ env.EXPORT_NAME }}_${{ env.VERSION }}_quest-debug.apk
