name: "godot-ci export"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version (e.g. v1.0.0)"
        required: true
        default: "v0.0.0"

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: "SUIT-VR-S3"
  VERSION: ${{ github.event.inputs.version }}

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-24.04
    steps:
      - name: Check version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${{ github.event.inputs.version }}'. Expected format: vX.Y.Z (e.g. v1.0.0)"
            exit 1
          fi

  import-assets:
    name: Import Assets
    runs-on: ubuntu-24.04
    needs: validate-version
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Import Assets
        run: godot --headless --verbose --import
      - name: Cache Imported Assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: ${{ runner.os }}-godot-imported-${{ hashFiles('**/*.import', '**/*.fbx', '**/*.obj', '**/*.png', '**/*.wav', '**/*.mp3', '**/*.otf', '**/*.ttf') }}

  export:
    name: Demo ${{ matrix.demo.number }} ${{ matrix.platform.name }}
    runs-on: ubuntu-24.04
    needs: import-assets
    container:
      image: barichello/godot-ci:4.7.2
    strategy:
      fail-fast: false
      matrix:
        demo:
          - { number: 1, zone: zone_1 }
          - { number: 2, zone: zone_2 }
        platform:
          - { name: Windows, id: windows, preset: "Windows Desktop", args: "--export-release", file_suffix: ".exe" }
          - { name: Linux, id: linux, preset: "Linux", args: "--export-release", file_suffix: ".x86_64" }
          # Debug export, signed with the image's debug keystore (sideload only).
          - { name: Quest, id: quest, preset: "Android", args: "--install-android-build-template --export-debug", file_suffix: "_quest-debug.apk" }
    env:
      DEMO_NAME: SUIT-VR-S3-Demo-${{ matrix.demo.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Setup Android Editor Settings
        if: matrix.platform.id == 'quest'
        # Editor settings (Android SDK/JDK paths, debug keystore) live under /root, but GitHub sets HOME=/github/home.
        run: |
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
      - name: Install Android SDK Packages
        if: matrix.platform.id == 'quest'
        # Godot 4.7's Gradle template needs newer SDK packages than the image ships.
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36" "ndk;29.0.14206865"
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Restore Imported Assets
        uses: actions/cache@v4
        with:
          path: .godot/imported/
          key: ${{ runner.os }}-godot-imported-${{ hashFiles('**/*.import', '**/*.fbx', '**/*.obj', '**/*.png', '**/*.wav', '**/*.mp3', '**/*.otf', '**/*.ttf') }}
      - name: Select Demo
        run: .github/scripts/select-demo.sh ${{ matrix.demo.number }} ${{ matrix.demo.zone }}
      - name: Export
        run: |
          mkdir -v -p build
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --import
          godot --headless --verbose ${{ matrix.platform.args }} "${{ matrix.platform.preset }}" "$EXPORT_DIR/${DEMO_NAME}${{ matrix.platform.file_suffix }}"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEMO_NAME }}_${{ env.VERSION }}_${{ matrix.platform.id }}
          path: build
          retention-days: 1

  release:
    name: Create Draft Release
    runs-on: ubuntu-24.04
    needs: export
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
      - name: Prepare Release Files
        run: |
          cd build
          for dir in *_windows *_linux; do
            (cd "$dir" && zip -r "../$dir.zip" .)
          done
          for dir in *_quest; do
            cp "$dir"/*.apk "$dir-debug.apk"
          done
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.version }}
          name: "${{ env.EXPORT_NAME }} ${{ github.event.inputs.version }}"
          files: |
            build/*.zip
            build/*.apk
