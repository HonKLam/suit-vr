name: "PR check"
on:
  pull_request:

jobs:
  check-zones:
    name: Load all zones
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Addon Binaries
        run: .github/scripts/fetch-addon-binaries.sh
      - name: Check Zones
        run: .github/scripts/check-zones.sh
